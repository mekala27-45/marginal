[project]
name = "marginal-evaluation"
version = "0.1.0"
description = "The recovery runner over seeds and conditions, paired bootstrap and Benjamini-Hochberg"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "marginal-core",
  "marginal-sim",
  "numpy>=1.26",
  "polars>=1.30",
  "scipy>=1.14",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marginal_evaluation"]
