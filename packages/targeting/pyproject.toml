[project]
name = "marginal-targeting"
version = "0.1.0"
description = "T and X learners with Qini, uplift and policy value on randomized holdouts; PEHE and quadrants on the simulator"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "marginal-core",
  "marginal-sim",
  "numpy>=1.26",
  "polars>=1.30",
  "pandas>=2.2",
  "lightgbm>=4.5",
  "scikit-learn>=1.5",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marginal_targeting"]
