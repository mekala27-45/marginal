[project]
name = "marginal-core"
version = "0.1.0"
description = "Shared models, formats, statements, hashing, paths and the manifest for marginal"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "pydantic>=2.10,<2.12",
  "structlog>=25.1",
  "pyyaml>=6.0",
  "polars>=1.30",
  "numpy>=1.26,<2.4",
  "pyarrow>=19",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marginal_core"]
