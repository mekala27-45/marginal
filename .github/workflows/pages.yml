name: pages

# Builds the static site in web/ and publishes it to GitHub Pages under /marginal. The site reads the
# bundle committed in web/public/data. The live API is named by the MARGINAL_API_URL repository
# variable; when the variable is empty the site uses the deployed address, and when the API is asleep
# every API feature answers from the recorded session and says so on the page.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /marginal
          NEXT_PUBLIC_MARGINAL_API: ${{ vars.MARGINAL_API_URL }}
      - run: npx playwright install --with-deps chromium
      # The tests load the exported site under /marginal with every request off the test server left
      # unanswered, so they pass whether the API is awake or not and never need the network.
      - name: Every route, the statement, the slider, the recorded save, the toggles, phone layouts
        run: npx playwright test
        env:
          NEXT_PUBLIC_BASE_PATH: /marginal
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
