[project]
name = "marginal-mmm"
version = "0.1.0"
description = "Two marketing mix model backends on one interface: own and bayes"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "marginal-core",
  "marginal-sim",
  "numpy>=1.26",
  "scipy>=1.14",
  "polars>=1.30",
  "pandas>=2.2",
  "pymc-marketing>=0.12",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marginal_mmm"]
