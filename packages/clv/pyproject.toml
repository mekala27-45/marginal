[project]
name = "marginal-clv"
version = "0.1.0"
description = "BG/NBD and Gamma-Gamma written in the repository with a holdout validation and the acquisition cost allowance"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "marginal-core",
  "numpy>=1.26",
  "scipy>=1.14",
  "polars>=1.30",
  "pandas>=2.2",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marginal_clv"]
