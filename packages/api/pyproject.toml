[project]
name = "marginal-api"
version = "0.1.0"
description = "The plan and experiment registry: FastAPI over Postgres with an audit log"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "marginal-core",
  "marginal-budget",
  "marginal-experiments",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "sqlmodel>=0.0.24",
  "sqlalchemy[asyncio]>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "httpx>=0.28",
  "numpy>=1.26",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marginal_api"]
