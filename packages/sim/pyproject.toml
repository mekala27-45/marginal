[project]
name = "marginal-sim"
version = "0.1.0"
description = "The seeded market with known truth: geo panel, customers with known effects, paths with known credit"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "marginal-core",
  "numpy>=1.26",
  "polars>=1.30",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marginal_sim"]
