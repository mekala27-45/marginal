[project]
name = "marginal"
version = "0.1.0"
description = "Marketing measurement and growth analytics for a fictional consumer brand: mix models graded on known truth, experiments that calibrate them, and a budget judged at the margin"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
authors = [{ name = "Ajay Mekala" }]
dependencies = [
  "marginal-core",
  "marginal-contracts",
  "marginal-sim",
  "marginal-evaluation",
  "marginal-mmm[bayes]",
  "marginal-experiments",
  "marginal-calibrate",
  "marginal-budget",
  "marginal-targeting",
  "marginal-clv",
  "marginal-attribution",
  "marginal-registry",
  "marginal-render",
  "marginal-api",
  "typer>=0.15",
]

[project.scripts]
marginal = "marginal_registry.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "anyio>=4.6",
  "hypothesis>=6.120",
  "ruff>=0.11",
  "mypy>=1.15",
  "types-PyYAML",
  "pandas-stubs",
  "nbmake>=1.5",
  "nbformat>=5.10",
  "nbconvert>=7.16",
  "ipykernel>=6.29",
  "matplotlib>=3.9",
  "httpx>=0.28",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
marginal-core = { workspace = true }
marginal-contracts = { workspace = true }
marginal-sim = { workspace = true }
marginal-evaluation = { workspace = true }
marginal-mmm = { workspace = true }
marginal-experiments = { workspace = true }
marginal-calibrate = { workspace = true }
marginal-budget = { workspace = true }
marginal-targeting = { workspace = true }
marginal-clv = { workspace = true }
marginal-attribution = { workspace = true }
marginal-registry = { workspace = true }
marginal-render = { workspace = true }
marginal-api = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = ["web", "data", "results", "notebooks", ".cache"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF100"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
mypy_path = "$MYPY_CONFIG_FILE_DIR/packages/api/src:$MYPY_CONFIG_FILE_DIR/packages/attribution/src:$MYPY_CONFIG_FILE_DIR/packages/budget/src:$MYPY_CONFIG_FILE_DIR/packages/calibrate/src:$MYPY_CONFIG_FILE_DIR/packages/clv/src:$MYPY_CONFIG_FILE_DIR/packages/contracts/src:$MYPY_CONFIG_FILE_DIR/packages/core/src:$MYPY_CONFIG_FILE_DIR/packages/evaluation/src:$MYPY_CONFIG_FILE_DIR/packages/experiments/src:$MYPY_CONFIG_FILE_DIR/packages/mmm/src:$MYPY_CONFIG_FILE_DIR/packages/registry/src:$MYPY_CONFIG_FILE_DIR/packages/render/src:$MYPY_CONFIG_FILE_DIR/packages/sim/src:$MYPY_CONFIG_FILE_DIR/packages/targeting/src"
explicit_package_bases = true
files = ["packages/*/src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
  "postgres: needs a reachable Postgres (MARGINAL_TEST_DATABASE_URL or local binaries)",
  "external: needs the real public datasets under data/external",
  "pymc: needs PyMC-Marketing importable",
  "lightgbm: needs LightGBM importable",
  "slow: full pipeline verification",
  "loadtest: runs the optimize load test against a live server",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["packages"]
omit = ["*/tests/*", "*/__main__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = false
skip_empty = true
