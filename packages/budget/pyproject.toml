[project]
name = "marginal-budget"
version = "0.1.0"
description = "Constrained budget optimization over fitted response curves with the marginal equalization check and the regret study"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "marginal-core",
  "marginal-mmm",
  "numpy>=1.26",
  "scipy>=1.14",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marginal_budget"]
