[project]
name = "marginal-calibrate"
version = "0.1.0"
description = "Lift results become constraints on own and priors on bayes; before and after recovery error"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "marginal-core",
  "marginal-mmm",
  "marginal-experiments",
  "numpy>=1.26",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marginal_calibrate"]
