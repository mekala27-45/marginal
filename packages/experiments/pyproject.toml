[project]
name = "marginal-experiments"
version = "0.1.0"
description = "Geo lift design with power by simulation, pre-registration, the SRM gate, difference in differences, synthetic control with placebo inference, and the email experiment"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "marginal-core",
  "marginal-evaluation",
  "marginal-sim",
  "numpy>=1.26",
  "scipy>=1.14",
  "polars>=1.30",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marginal_experiments"]
